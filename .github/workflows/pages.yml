name: Pubblicazione su GitHub Pages

# Pubblica dist/pa500-adattatore.html come pagina del repository dopo che
# «Attribuzione e test» è passato su main, oppure a mano (Run workflow).
# Richiede Settings > Pages > Source «GitHub Actions».
# I permessi di job sostituiscono quelli globali: il job dichiara anche
# contents: read, senza il quale il repository privato risulta inesistente.

on:
  workflow_run:
    workflows: ["Attribuzione e test"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pubblica:
    name: Pubblica la pagina
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Prepara il sito
        run: |
          mkdir -p _site
          cp dist/pa500-adattatore.html _site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site/
      - id: deploy
        uses: actions/deploy-pages@v5
